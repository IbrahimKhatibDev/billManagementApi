name: billmanagement

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billdb
      POSTGRES_USER: bills
      POSTGRES_PASSWORD: bills_dev_password
    # Published so `dotnet run` on the host can reuse this database with the
    # default appsettings.json. If you already run Postgres locally, change this
    # to "5433:5432" and update the connection string to match.
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The postgres image runs a temporary internal server during first-time
      # init, so pg_isready can briefly report ready before the real one is up.
      # start_period plus EnableRetryOnFailure in the API closes that gap.
      test: ["CMD-SHELL", "pg_isready -U bills -d billdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      # The repository root, not the project directory: the API and the Blazor
      # app both reference BillsMinimalApi.Contracts, and a build only sees
      # what is inside its context. The root .dockerignore keeps that context
      # from including the whole working tree.
      context: .
      dockerfile: BillsMinimalApi/Dockerfile
    environment:
      # Development is deliberate: Program.cs gates UseSwagger on it, and
      # /swagger is the documented way to poke at this API.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=billdb;Username=bills;Password=bills_dev_password"
      # A fixed development key, and only that. Program.cs would invent one per
      # run in Development, which would silently log everybody out on every
      # `docker compose restart`; pinning it here keeps a token valid across
      # restarts of the demo stack. It is in source control, so it is public —
      # anything real gets its key from the deployment environment instead.
      Jwt__SigningKey: "dev-only-signing-key-not-for-production-32b+"
    ports:
      - "5131:8080"
    depends_on:
      db:
        condition: service_healthy

  blazor:
    build:
      # Repo root, same reason as the api service above.
      context: .
      dockerfile: bills-frontend/BillsFrontEndBlazor/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # Reached over the compose network, not from the browser: this is Blazor
      # Server, so every BillService call originates inside this container.
      # The trailing slash is required — BillService issues relative URIs.
      BillsApi__BaseUrl: "http://api:8080/"
    ports:
      - "5254:8080"
    depends_on:
      - api

  react:
    build:
      context: ./bills-frontend/FrontEndReact
      args:
        # Baked into the bundle at build time, not read at runtime. Unlike the
        # blazor service above, this one is a static SPA served by nginx: the
        # request comes from the browser, so it needs the API's published host
        # port rather than the compose-network name. Change this and the port
        # mapping on api together.
        #
        # The API root, not one endpoint: the client reaches /restapi/BillDtos
        # and /auth/* and builds both from this.
        VITE_API_BASE_URL: "http://localhost:5131"
    # Matches the Vite dev-server port, so the URL is the same whether you run
    # this in Docker or with `npm run dev`.
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
