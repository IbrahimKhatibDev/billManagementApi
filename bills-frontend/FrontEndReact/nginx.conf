server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits hashed filenames under /assets, so the name changes whenever the
    # contents do and the old URL is never reused. That makes them safe to cache
    # indefinitely. This block comes first so it wins over the SPA fallback below.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: only index.html is a real document, so any path that does
    # not match a file on disk falls back to it rather than 404ing. Without this,
    # reloading the page on a client-side route serves nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
